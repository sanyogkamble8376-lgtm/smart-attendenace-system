<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sapre Precision Technologies - Smart Attendance System</title>
    <!-- Tailwind CSS for modern UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen font-sans">

    <div class="max-w-7xl mx-auto px-4 py-8">
        <!-- Header -->
        <header class="bg-indigo-900 text-white rounded-xl shadow-lg p-6 mb-8 flex flex-col md:flex-row justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold tracking-wider">Sapre Precision Technologies</h1>
                <p class="text-indigo-200 mt-1">Smart Attendance & Overtime Tracking System</p>
            </div>
            <div class="mt-4 md:mt-0 bg-indigo-800 px-4 py-2 rounded-lg text-sm border border-indigo-700">
                <i class="fa-solid fa-cloud-arrow-up text-emerald-400 mr-2"></i> Cloud Synced (Mumbai)
            </div>
        </header>

        <!-- Main Dashboard Container -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Attendance Form Section -->
            <div class="bg-white rounded-xl shadow-md p-6 lg:col-span-1 border border-slate-200">
                <h2 class="text-xl font-semibold text-slate-800 mb-4 flex items-center">
                    <i class="fa-solid fa-user-clock text-indigo-600 mr-2"></i> Record Attendance
                </h2>
                <form id="attendanceForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Employee Name</label>
                        <input type="text" id="empName" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Enter full name">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Check-in Time</label>
                        <input type="time" id="checkInTime" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Check-out Time</label>
                        <input type="time" id="checkOutTime" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition duration-200 shadow-md">
                        Save Attendance Record
                    </button>
                </form>
            </div>

            <!-- Records Table Section -->
            <div class="bg-white rounded-xl shadow-md p-6 lg:col-span-2 border border-slate-200 overflow-hidden">
                <h2 class="text-xl font-semibold text-slate-800 mb-4 flex items-center justify-between">
                    <span><i class="fa-solid fa-table-list text-indigo-600 mr-2"></i> Attendance Log</span>
                    <span class="text-xs bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full font-medium">Live Cloud Database</span>
                </h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 border-b text-slate-600 text-sm">
                                <th class="p-3">Employee</th>
                                <th class="p-3">In Time</th>
                                <th class="p-3">Out Time</th>
                                <th class="p-3">Status</th>
                                <th class="p-3">Overtime</th>
                            </tr>
                        </thead>
                        <tbody id="attendanceTableBody" class="text-sm divide-y divide-slate-100">
                            <!-- Dynamic rows will load here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Your Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBwCiTb9WpNJi2VXPUNPWuckUpDLThNLhE",
            authDomain: "smart-attendance-system-46ba4.firebaseapp.com",
            projectId: "smart-attendance-system-46ba4",
            storageBucket: "smart-attendance-system-46ba4.appspot.com",
            messagingSenderId: "837536664218",
            appId: "1:837536664218:web:d31197fd607fccaaead23",
            measurementId: "G-8WKWHZ62RS"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById('attendanceForm');
        const tableBody = document.getElementById('attendanceTableBody');

        // Handle Form Submit
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('empName').value;
            const inTime = document.getElementById('checkInTime').value;
            const outTime = document.getElementById('checkOutTime').value;

            // Business Logic: 9:00 AM Cutoff, 9-hour OT trigger
            const [inHour, inMin] = inTime.split(':').map(Number);
            const status = (inHour > 9 || (inHour === 9 && inMin > 0)) ? 'Late' : 'On Time';

            // Calculate hours worked
            const [outHour, outMin] = outTime.split(':').map(Number);
            const totalMinutesWorked = (outHour * 60 + outMin) - (inHour * 60 + inMin);
            const hoursWorked = totalMinutesWorked / 60;
            const overtime = hoursWorked > 9 ? (hoursWorked - 9).toFixed(1) + ' hrs' : 'None';

            try {
                await addDoc(collection(db, "attendance"), {
                    name,
                    inTime,
                    outTime,
                    status,
                    overtime,
                    timestamp: new Date()
                });
                form.reset();
                loadAttendance();
            } catch (error) {
                console.error("Error adding document: ", error);
            }
        });

        // Load Records from Firestore
        async function loadAttendance() {
            tableBody.innerHTML = '';
            try {
                const q = query(collection(db, "attendance"), orderBy("timestamp", "desc"));
                const querySnapshot = await getDocs(q);
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const statusBadge = data.status === 'Late' 
                        ? '<span class="bg-rose-100 text-rose-700 px-2 py-1 rounded text-xs font-semibold">Late</span>' 
                        : '<span class="bg-emerald-100 text-emerald-700 px-2 py-1 rounded text-xs font-semibold">On Time</span>';

                    const row = `<tr class="hover:bg-slate-50">
                        <td class="p-3 font-medium text-slate-800">${data.name}</td>
                        <td class="p-3 text-slate-600">${data.inTime}</td>
                        <td class="p-3 text-slate-600">${data.outTime}</td>
                        <td class="p-3">${statusBadge}</td>
                        <td class="p-3 text-indigo-600 font-medium">${data.overtime}</td>
                    </tr>`;
                    tableBody.innerHTML += row;
                });
            } catch (error) {
                console.error("Error loading documents: ", error);
            }
        }

        // Initial Load
        loadAttendance();
    </script>
</body>
</html>
